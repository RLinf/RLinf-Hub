name: Skills Tests

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".gemini/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/skills_test.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "tests/skills/**"
  push:
    branches: [main]
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".gemini/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/skills_test.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "tests/skills/**"

permissions:
  contents: read

jobs:
  skills-tests:
    name: Skills unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest pyyaml
      - name: Run skill unit tests
        run: pytest tests/skills -v
